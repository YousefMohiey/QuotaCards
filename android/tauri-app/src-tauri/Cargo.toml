[package]
name = "quotacards-tauri"
version = "0.3.3"
edition = "2021"

[lib]
name = "quotacards_tauri"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-qctunnel = { path = "../../tauri-plugin-qctunnel" }
tokio = { version = "1", features = ["rt", "macros", "time", "net", "fs", "io-util"] }
uuid = { version = "1", features = ["v4", "serde"] }
ssh-key = { version = "0.6", features = ["ed25519", "rand_core", "std"] }
rand_core = { version = "0.6", features = ["getrandom", "std"] }
# Desktop core: server setup + card add/revoke over SSH (vpn/ stays Windows-only).
quotacards = { path = "../../.." }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

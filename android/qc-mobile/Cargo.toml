[package]
name = "qc-mobile"
version = "0.1.0"
edition = "2021"

[lib]
name = "qc_mobile"
crate-type = ["cdylib", "lib"]

[dependencies]
# Reuses the desktop core: server setup + card add/revoke over SSH.
# (vpn/ stays Windows-only and is cfg'd out of the lib on Android.)
quotacards = { path = "../.." }
eframe = { version = "0.36", default-features = false, features = ["android-native-activity", "wgpu", "default_fonts"] }
egui = "0.36"
winit = "0.30"
uuid = { version = "1", features = ["v4"] }
tokio = { version = "1", features = ["rt", "macros", "time", "net", "fs", "io-util"] }
ssh-key = { version = "0.6", features = ["ed25519", "rand_core", "std"] }
rand_core = { version = "0.6", features = ["getrandom", "std"] }
android_logger = "0.15"
log = "0.4"

[package.metadata.android]
package = "com.quotacards.app"
build_targets = ["aarch64-linux-android"]
activity = "android.app.NativeActivity"

[package.metadata.android.sdk]
min_sdk_version = 26
target_sdk_version = 35

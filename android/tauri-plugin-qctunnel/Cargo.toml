[package]
name = "tauri-plugin-qctunnel"
version = "0.1.0"
edition = "2021"
description = "sing-box VPN tunnel (TUN) for QuotaCards on Android"
license = "MIT"
build = "build.rs"
links = "tauri-plugin-qctunnel"

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
thiserror = "1"

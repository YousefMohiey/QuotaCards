[package]
name = "quotacards-desktop"
version = "0.3.1"
default-run = "QuotaVPN"
edition = "2021"

[lib]
name = "quotacards_desktop"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "QuotaVPN"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-updater = "2"
tauri-plugin-single-instance = "2"
# Exit-address lookup for the speed page. In Rust so no webview policy,
# CORS rule or fetch quirk can block it. Rustls is already in the tree for
# the updater, so this adds no new TLS stack.
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json"] }
image = { version = "0.25", default-features = false, features = ["png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "macros", "time", "net", "fs", "io-util"] }
uuid = { version = "1", features = ["v4", "serde"] }
ssh-key = { version = "0.6", features = ["ed25519", "rand_core", "std"] }
rand_core = { version = "0.6", features = ["getrandom", "std"] }
# Shared core: server setup + cards over SSH, Windows sing-box engine.
quotacards = { path = "../.." }

[target.'cfg(windows)'.dependencies]
# TUN adapter byte counters for the live traffic chart.
windows = { version = "0.62", features = ["Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_Foundation"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
# The bare exe is served as a test download and folded into the installer:
# keep it lean (the default profile left ~17 MB of symbol table in it).
strip = true

[package]
name = "quotacards-desktop"
version = "0.2.2"
edition = "2021"

[lib]
name = "quotacards_desktop"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "quotacards"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-updater = "2"
tauri-plugin-single-instance = "2"
image = { version = "0.25", default-features = false, features = ["png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "macros", "time", "net", "fs", "io-util"] }
uuid = { version = "1", features = ["v4", "serde"] }
ssh-key = { version = "0.6", features = ["ed25519", "rand_core", "std"] }
rand_core = { version = "0.6", features = ["getrandom", "std"] }
# Shared core: server setup + cards over SSH, Windows sing-box engine.
quotacards = { path = "../.." }

[target.'cfg(windows)'.dependencies]
# TUN adapter byte counters for the live traffic chart.
windows = { version = "0.62", features = ["Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_Foundation"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
